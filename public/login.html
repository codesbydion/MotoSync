<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - MotoSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="modern.css" />
</head>
<body class="modern-page">
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo-link">
        <div class="logo">
          <span class="logo-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 17h14M7 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0Zm14 0a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM7 17l2-7h6l2 7M9 10l-2-3m8 3 2-3"/></svg>
          </span>
          <span class="logo-text"><strong>MotoSync</strong><small>Vehicle Maintenance & Service Tracker</small></span>
        </div>
      </a>
      <nav class="nav-right">
        <a href="index.html">Home</a>
        <a href="index.html#features">Features</a>
        <a href="index.html#how-it-works">Process</a>
        <a href="about.html">About</a>
        <a href="register.html" class="btn-register">Register</a>
      </nav>
    </div>
  </header>

  <main class="auth-shell container">
    <div class="login-card">
      <h2>Login</h2>
      <form id="loginForm">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter Email" required autocomplete="email" />

        <label for="password">Password</label>
        <div class="password-wrap" data-visible="false">
          <input type="password" id="password" placeholder="Enter Password" required autocomplete="current-password" />
          <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
            <svg class="pw-icon pw-icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M2.5 12s3.5-7 9.5-7 9.5 7 9.5 7-3.5 7-9.5 7-9.5-7-9.5-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="pw-icon pw-icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 3l18 18"></path>
              <path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"></path>
              <path d="M6.2 6.2C4.1 7.7 2.5 10.2 2.5 12c0 0 3.5 7 9.5 7 1.7 0 3.2-.4 4.5-1.1"></path>
              <path d="M9.3 4.2A9.4 9.4 0 0 1 12 5c6 0 9.5 7 9.5 7a18.2 18.2 0 0 1-3.1 4.2"></path>
            </svg>
          </button>
        </div>

        <button type="submit" class="login-btn">Login</button>
        <p id="msg"></p>
      </form>

      <p class="forgot-link"><a href="reset.html">Forgot password?</a></p>
      <p class="register-link">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </main>

  <div id="toast"></div>

  <footer class="footer">
    <p>&copy; 2026 MotoSync. All Rights Reserved.</p>
  </footer>

  <script src="auth.js"></script>
  <script src="ui.js"></script>
</body>
</html>
